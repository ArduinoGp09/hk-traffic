name: Deploy hk-traffic to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 取出網站檔案
        uses: actions/checkout@v4
      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: 準備部署檔案
        run: |
          mkdir -p site/icons
          cp index.html manifest.webmanifest service-worker.js .nojekyll site/
          cp icons/icon-192.png icons/icon-512.png site/icons/
      - name: 打包 PWA 網站
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - name: 發布網站
        id: deployment
        uses: actions/deploy-pages@v4
